name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rubric from private repo
        run: |
          curl -H "Authorization: token ${{ secrets.DATA_REPO_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -L "https://api.github.com/repos/amoghmpanhale/resume-review-data/contents/rubric.json" \
               -o rubric.json

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
